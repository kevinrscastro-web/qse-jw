services:
  - type: web
    name: jw-biblico-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: DB_PATH
        value: /data/jw_game.db
      - key: ALLOWED_ORIGINS
        value: https://jw-biblico-web.onrender.com
    disk:
      name: jw-biblico-data
      mountPath: /data
      sizeGB: 1

  - type: static
    name: jw-biblico-web
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://jw-biblico-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
